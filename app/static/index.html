<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <title>麻雀アシスト</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <header class="topbar">
    <h1>麻雀アシスト</h1>
    <span id="mode" class="badge">接続中…</span>
  </header>

  <main>
    <section class="camera card">
      <div class="viewport">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="cameraHint" class="camera-hint">「カメラ開始」を押して手牌を横一列に映してください</div>
      </div>
      <div class="row">
        <button id="cameraBtn" class="primary">カメラ開始</button>
      </div>
      <p id="camStatus" class="status">カメラを開始すると、手牌を自動で読み取ってアシストします。</p>
      <p id="modeNote" class="note" hidden>はじめて使う牌セットは、牌の見た目を覚えさせる必要があります。手牌を映したまま、下で左から順に正しい牌を入力し「この並びで覚える」を押してください。同じ卓の誰かが覚えさせれば全員に反映されます。</p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>手牌 <small id="count">0枚</small> <small id="manualBadge" class="manual" hidden>手で修正中</small></h2>
        <div class="mini-actions">
          <button id="sortBtn">理牌</button>
          <button id="clearBtn">全消去</button>
          <button id="demoBtn">例</button>
        </div>
      </div>
      <div id="hand" class="tiles hand"></div>
      <div id="tileActions" class="row tile-actions" hidden>
        <button id="removeTileBtn">この牌を削除</button>
        <button id="winTileBtn">アガリ牌にする</button>
      </div>
      <p class="tip">牌をタップして下の牌ボタンを押すと、その牌を置き換えられます。</p>
      <div class="row">
        <button id="teachBtn" class="primary" hidden>この並びで覚える</button>
        <button id="autoBtn" hidden>自動認識に戻す</button>
      </div>
      <div class="dora-line">ドラ表示牌: <span id="dora" class="tiles small"></span></div>

      <div class="target-switch" role="radiogroup">
        <label><input type="radio" name="target" value="hand" checked> 手牌に追加</label>
        <label><input type="radio" name="target" value="dora"> ドラ表示牌に追加</label>
      </div>
      <div id="palette" class="palette"></div>
    </section>

    <section class="card">
      <h2>局の設定</h2>
      <div class="settings">
        <label>自風
          <select id="seatWind">
            <option value="east">東（親）</option><option value="south">南</option>
            <option value="west">西</option><option value="north">北</option>
          </select>
        </label>
        <label>場風
          <select id="roundWind"><option value="east">東場</option><option value="south">南場</option></select>
        </label>
        <label>本場 <input id="honba" type="number" min="0" max="20" value="0" inputmode="numeric"></label>
        <label class="check"><input id="riichi" type="checkbox"> リーチ</label>
        <label class="check"><input id="tsumo" type="checkbox"> ツモ</label>
        <label class="check"><input id="ippatsu" type="checkbox"> 一発</label>
      </div>
    </section>

    <section id="result" class="card result" aria-live="polite">
      <h2>アシスト</h2>
      <p id="message" class="message">手牌を映すか入力すると、ここに「何を切るか」「狙える役」「点数」が出ます。</p>
      <div id="score"></div>
      <div id="waits"></div>
      <div id="discards"></div>
      <div id="hints"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <footer class="foot">鳴き（ポン・チー・カン）は今後対応予定です</footer>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
